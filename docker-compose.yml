version: '3.8'

services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production
    container_name: fastapi-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models/disease_prediction:/app/models/disease_prediction:ro
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=/app/models/disease_prediction
      - LOG_LEVEL=INFO
      - WORKERS=4
      - MAX_BATCH_SIZE=32
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge